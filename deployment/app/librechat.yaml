  endpointsMenu: false
  modelSelect: false
  parameters: false
  agents: false
  presets: false
  multiConvo: false
  prompts: false
  skills: false
  memories: false
  bookmarks: false
  marketplace:
    use: false
  mcpServers:
    use: false
    create: false

endpoints:
  custom:
    - name: Resident Guide
      iconURL: /assets/residential-front-desk.svg
      apiKey: '${RESIDENT_GATEWAY_KEY}'
      baseURL: http://gateway:8000/v1
      models:
        default: [gemini-3.6-flash]
        fetch: false
      titleConvo: false
      modelDisplayLabel: Residential Building Assistant

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: resident-guide
      label: Residential Building Assistant
      iconURL: /assets/residential-front-desk.svg
      default: true
      showOnLanding: true
      description: Ask about amenities, maintenance, visitors, or moving in.
      conversation_starters:
        - Is the pool open on Mondays?
        - How do I report maintenance?
        - How do I arrange a move?
        - Where can visitors park?
      preset:
        endpoint: Resident Guide
        model: gemini-3.6-flash
        max_tokens: 1024
