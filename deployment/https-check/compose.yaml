services:
  caddy:
    image: caddy:2
    container_name: residential-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
    name: residential-caddy-data
  caddy_config:
    name: residential-caddy-config
