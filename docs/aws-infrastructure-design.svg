<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1040" viewBox="0 0 1660 1040" role="img" aria-labelledby="title desc">
<title id="title">Residential Building Assistant AWS infrastructure</title>
<desc id="desc">Resident browser connects over HTTPS to Caddy, then LibreChat and the Resident gateway on EC2 in Singapore. LibreChat stores chats in MongoDB. The gateway uses the S3 handbook and Gemini API. Scheduled jobs back up the database and check answers. CloudWatch and SNS notify the operator by email.</desc>
